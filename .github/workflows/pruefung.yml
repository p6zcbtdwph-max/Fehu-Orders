# Automatische Prüfung bei jedem Pull Request und auf main:
# Tests, Typprüfung und Lint. Ein roter Haken heißt: nicht mergen, erst reparieren.
name: Prüfung

# Sparsam prüfen (25.11.2026): Ein gemergter PR (Committer GitHub) wird auf main nicht noch einmal
# geprüft, direkte Pushes auf main schon. Reine Doku-Änderungen (*.md, docs/) lösen nichts aus.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

# Sparsam prüfen (25.11.2026): ein neuer Push bricht den alten Lauf derselben Branch ab.
concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefung:
    if: github.event_name != 'push' || github.event.head_commit.committer.email != 'noreply@github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Electron selbst wird für Tests nicht gebraucht (wird in den Tests nachgebildet)
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
